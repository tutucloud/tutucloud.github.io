<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tu-X online tool — runs fully in your browser, no data leaves your device.">
  <title>hash — Tu-X Tools</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/style.css?v=e8c5fea7">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">
        <span class="logo-mark">TX</span>
        <span class="logo-text">Tu-X</span>
      </a>
      <nav class="nav" id="nav">
        <div class="nav-item has-drop">
          <a href="/#projects" data-i18n="nav.projects"></a>
          <div class="drop" id="drop-projects"></div>
        </div>
        <div class="nav-item has-drop">
          <a href="/#tools" data-i18n="nav.tools"></a>
          <div class="drop" id="drop-tools"></div>
        </div>
        <a href="/#about" data-i18n="nav.about"></a>
      </nav>
      <div class="header-actions">
        <div class="lang-wrap">
          <button class="icon-btn" id="langBtn" title="Language" aria-label="Switch language" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
            <span id="langLabel">EN</span>
          </button>
          <div class="lang-menu" id="langMenu" role="menu"></div>
        </div>
        <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h1 data-i18n="tools.hash.name"></h1>
          <p data-i18n="tools.subtitle"></p>
        </div>

<div class="tool-panel is-active" data-panel="hash">
          <label class="tool-label" data-i18n="tools.hash.input"></label>
          <textarea id="hashInput" class="tool-textarea tool-textarea-sm" spellcheck="false"></textarea>
          <div class="tool-actions">
            <button class="btn btn-primary btn-sm" id="hashBtn" data-i18n="tools.hash.compute"></button>
          </div>
          <div id="hashResults" class="hash-results"></div>
        </div>

        <div class="tool-chips" id="toolChips"><!-- rendered by JS --></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Tu-X</span>
      <span class="footer-note" data-i18n="footer.note"></span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="../assets/i18n.js?v=7e586434"></script>
  <script src="../assets/data.js?v=e4a140eb"></script>
  <script src="../assets/qr.js?v=a260390b"></script>
  <script src="../assets/app.js?v=20a74442"></script>
  <script src="../assets/tools.js?v=3717b4c6"></script>
</body>
</html>
