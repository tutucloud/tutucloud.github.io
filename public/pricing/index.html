<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Tu-X pricing — Free, Standard, Pro and VIP plans.">
  <title>Pricing — Tu-X</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .pricing { max-width: 1080px; margin: 0 auto; padding: 48px 24px 80px; }
    .pricing .section-head { margin-bottom: 36px; }
    .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; align-items: stretch; }
    .plan {
      display: flex; flex-direction: column; gap: 14px;
      padding: 26px 22px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .plan.is-featured { border-color: var(--accent); box-shadow: 0 12px 34px -12px var(--accent); }
    .plan-name { font-size: 1.05rem; font-weight: 750; }
    .plan-price { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
    .plan-price .period { font-size: 0.85rem; font-weight: 600; color: var(--text-2); }
    .plan-desc { color: var(--text-2); font-size: 0.92rem; line-height: 1.7; flex: 1; }
    .plan .btn { justify-content: center; }
    .fineprint { margin-top: 28px; color: var(--muted); font-size: 0.82rem; line-height: 1.7; text-align: center; }
  </style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">
        <span class="logo-mark">TX</span>
        <span class="logo-text">Tu-X</span>
      </a>
      <nav class="nav" id="nav">
        <div class="nav-item has-drop">
          <a href="/#projects" data-i18n="nav.projects"></a>
          <div class="drop" id="drop-projects"></div>
        </div>
        <div class="nav-item has-drop">
          <a href="/#tools" data-i18n="nav.tools"></a>
          <div class="drop" id="drop-tools"></div>
        </div>
        <div class="nav-item has-drop">
          <a href="/#ai" data-i18n="nav.ai"></a>
          <div class="drop" id="drop-ai"></div>
        </div>
        <a href="/#about" data-i18n="nav.about"></a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="langBtn" title="Language" aria-label="Switch language" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
          <span id="langLabel">EN</span>
        </button>
        <div class="lang-wrap">
          <div class="lang-menu" id="langMenu" role="menu"></div>
        </div>
        <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="pricing">
    <div class="section-head">
      <h1 data-i18n="pricing.title"></h1>
      <p data-i18n="pricing.subtitle"></p>
    </div>

    <div class="plan-grid">
      <div class="plan">
        <div class="plan-name" data-i18n="pricing.free.name"></div>
        <div class="plan-price"><span data-i18n="pricing.free.price"></span></div>
        <p class="plan-desc" data-i18n="pricing.free.desc"></p>
        <a class="btn btn-ghost" href="/" data-i18n="pricing.free.cta"></a>
      </div>
      <div class="plan is-featured">
        <div class="plan-name" data-i18n="pricing.standard.name"></div>
        <div class="plan-price">$9.9<span class="period"> / <span data-i18n="pricing.month"></span></span></div>
        <p class="plan-desc" data-i18n="pricing.standard.desc"></p>
        <a class="btn btn-primary" href="mailto:feedbacktu-xcom@googlegroups.com?subject=Subscribe%20Standard%20Plan" data-i18n="pricing.subscribe"></a>
      </div>
      <div class="plan">
        <div class="plan-name" data-i18n="pricing.pro.name"></div>
        <div class="plan-price">$19.9<span class="period"> / <span data-i18n="pricing.month"></span></span></div>
        <p class="plan-desc" data-i18n="pricing.pro.desc"></p>
        <a class="btn btn-primary" href="mailto:feedbacktu-xcom@googlegroups.com?subject=Subscribe%20Pro%20Plan" data-i18n="pricing.subscribe"></a>
      </div>
      <div class="plan">
        <div class="plan-name" data-i18n="pricing.vip.name"></div>
        <div class="plan-price" data-i18n="pricing.vip.price"></div>
        <p class="plan-desc" data-i18n="pricing.vip.desc"></p>
        <a class="btn btn-ghost" href="mailto:feedbacktu-xcom@googlegroups.com?subject=VIP%20Plan%20Inquiry" data-i18n="pricing.vip.cta"></a>
      </div>
    </div>

    <p class="fineprint" data-i18n="pricing.fineprint"></p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Tu-X</span>
      <a class="footer-note" href="mailto:feedbacktu-xcom@googlegroups.com" data-i18n="footer.feedback"></a>
      <a class="footer-note" id="pricingLink" href="/pricing/" data-i18n="pricing.navlink" style="display:none"></a>
      <span class="footer-note" data-i18n="footer.note"></span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="../assets/i18n.js"></script>
  <script src="../assets/data.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script>
    // 价格页入口仅在正式域名下显示
    (function () {
      if (location.hostname === 'tu-x.com') {
        var el = document.getElementById('pricingLink');
        if (el) el.style.display = '';
      }
    })();
  </script>
</body>
</html>
