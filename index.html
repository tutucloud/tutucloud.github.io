<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tu-X — 项目展示与在线工具">
  <title>Tu-X</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./assets/style.css?v=c29edecc">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3853765839881693" crossorigin="anonymous"></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="./">
        <span class="logo-mark">TX</span>
        <span class="logo-text">Tu-X</span>
      </a>
      <nav class="nav" id="nav">
        <div class="nav-item has-drop">
          <a href="#projects" data-i18n="nav.projects"></a>
          <div class="drop" id="drop-projects"></div>
        </div>
        <div class="nav-item has-drop">
          <a href="#tools" data-i18n="nav.tools"></a>
          <div class="drop" id="drop-tools"></div>
        </div>
        <div class="nav-item has-drop">
          <a href="#ai" data-i18n="nav.ai"></a>
          <div class="drop" id="drop-ai"></div>
        </div>
        <a href="#about" data-i18n="nav.about"></a>
      </nav>
      <div class="header-actions">
        <div class="lang-wrap">
          <button class="icon-btn" id="langBtn" title="Language" aria-label="Switch language" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
            <span id="langLabel">EN</span>
          </button>
          <div class="lang-menu" id="langMenu" role="menu"></div>
        </div>
        <button class="icon-btn" id="themeBtn" title="Theme" aria-label="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn nav-toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="container">
        <p class="hero-eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 class="hero-title">
          <span data-i18n="hero.title1"></span><br>
          <span class="gradient-text" data-i18n="hero.title2"></span>
        </h1>
        <p class="hero-sub" data-i18n="hero.subtitle"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#projects" data-i18n="hero.ctaProjects"></a>
          <a class="btn btn-ghost" href="#tools" data-i18n="hero.ctaTools"></a>
        </div>
      </div>
    </section>

    <!-- Projects -->
    <section id="projects" class="section">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="projects.title"></h2>
          <p data-i18n="projects.subtitle"></p>
        </div>
        <div class="grid" id="projectGrid"><!-- rendered by JS --></div>
      </div>
    </section>

    <!-- Tools -->
    <section id="tools" class="section section-alt">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="tools.title"></h2>
          <p data-i18n="tools.subtitle"></p>
        </div>

        <div class="grid-tools" id="toolsGrid"><!-- rendered by JS --></div>
      </div>
    </section>

    <!-- AI Tools -->
    <section id="ai" class="section">
      <div class="container">
        <div class="section-head">
          <h2 data-i18n="ai.title"></h2>
          <p data-i18n="ai.subtitle"></p>
        </div>
        <div class="grid" id="aiGrid"><!-- rendered by JS --></div>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="section">
      <div class="container about-inner">
        <h2 data-i18n="about.title"></h2>
        <p data-i18n="about.body"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Tu-X</span>
      <span class="footer-note" data-i18n="footer.note"></span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="./assets/i18n.js?v=9096cab9"></script>
  <script src="./assets/data.js?v=70716161"></script>
  <script src="./assets/qr.js?v=a260390b"></script>
  <script src="./assets/app.js?v=e93f1042"></script>
  <script src="./assets/tools.js?v=bed3b5d9"></script>
</body>
</html>
